name: Build Debug APK & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK to GitHub Releases'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Custom tag name for release (leave blank for latest-debug or git tag)'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Secrets & Debug Keystore
        run: |
          echo "Preparing environment configuration..."
          # Restore or generate .env file
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Restore debug keystore from base64 if present, else generate
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Grant execution permission to gradlew if it exists
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Stage APK Artifacts
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file found in app/build/outputs/apk/debug"
            exit 1
          fi
          echo "Found built APK at: $APK_FILE"
          cp "$APK_FILE" release-assets/flipkart-debug.apk
          cp "$APK_FILE" release-assets/app-debug.apk
          ls -lh release-assets/

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flipkart-debug-apk
          path: release-assets/flipkart-debug.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        if: |
          (startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release) ||
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || 'latest-debug') }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Flipkart Release {0}', github.ref_name) || (inputs.release_tag != '' && format('Flipkart Release {0}', inputs.release_tag) || 'Flipkart App - Latest Debug APK') }}
          body: |
            ### 🛒 Flipkart Android Application - Debug APK Build
            
            Direct download link for Android devices:
            - 📥 **Download APK:** [`flipkart-debug.apk`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || 'latest-debug') }}/flipkart-debug.apk)
            - **Commit SHA:** `${{ github.sha }}`
            - **Branch/Ref:** `${{ github.ref_name }}`
            
            #### 📱 Installation Instructions:
            1. Tap the **`flipkart-debug.apk`** download link directly from your Android phone or tablet.
            2. Open the downloaded file from the Downloads folder or status bar notification.
            3. If prompted with *"For your security, your phone is not allowed to install unknown apps from this source"*, tap **Settings** and toggle **Allow from this source**.
            4. Tap **Install** and enjoy shopping with the **Flipkart** app!
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            release-assets/flipkart-debug.apk
            release-assets/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
